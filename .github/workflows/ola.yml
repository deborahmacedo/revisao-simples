name: Workfloe ola

on:
  workflow_dispatch:
    inputs:
      nome:
        description: 'Digite o nome'
        required: false
        default: turma 
        type: string

jobs: 
  dizer-ola:
    runs-on: ubuntu-latest
    steps: 
      - name: Exibir saudação
        env: 
          NOME: ${{ inputs.nome }}
        run: echo "Olá, NOME"
      - name: rodar no docker
        run: docker --version
  dizer-fim:
    needs: dizer-ola
    runs-on: ubuntu-latest
    steps:  
      - name: exibir fim
        run: echo fim
    